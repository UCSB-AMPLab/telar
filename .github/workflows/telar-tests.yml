name: Test Telar Scripts
#
# This workflow runs Telar's unit test suites:
#
# 1. Python unit tests — CSV parsing, column normalisation, widget rendering,
#    IIIF metadata extraction, glossary linking, and image processing.
#
# 2. JavaScript unit tests — coordinate maths, manifest URL resolution,
#    content detection predicates, and state structure.
#
# On pull request to main, all test suites run automatically. When triggered
# manually via workflow_dispatch, you can choose which suites to run.
#
# Version: v1.8.0

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_python:
        description: 'Run Python unit tests'
        type: boolean
        default: true
      run_javascript:
        description: 'Run JavaScript unit tests'
        type: boolean
        default: true

# Least-privilege default token: this workflow only reads the checkout to run
# tests. Fork pull requests already receive a read-only token, but declaring it
# explicitly keeps the guarantee independent of org/repo defaults.
permissions:
  contents: read

# Framework unit tests run only in the Telar repos, not in sites built from
# this template, and only for the suites selected on manual dispatch.
jobs:
  python:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    if: ${{ (github.repository == 'UCSB-AMPLab/telar' || github.repository == 'juancobo/telar') && (github.event_name != 'workflow_dispatch' || inputs.run_python) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Some tests read files at a release tag (the shipped components README,
      # the v1.7.0 delivery set). The tags live on the public repository.
      - name: Fetch the release tags
        run: git fetch --tags --force https://github.com/UCSB-AMPLab/telar.git

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short

  javascript:
    name: JavaScript Unit Tests
    runs-on: ubuntu-latest
    if: ${{ (github.repository == 'UCSB-AMPLab/telar' || github.repository == 'juancobo/telar') && (github.event_name != 'workflow_dispatch' || inputs.run_javascript) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 22: jsdom 30 needs ^22.22.2 and its undici >=22.19.0, and Node 20 is
      # past end of life. Every engine range in package-lock.json accepts it.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: npm run test:js
